# Local development only; combine with docker-compose.yml.
services:
  backend:
    environment:
      AUTOAUTH_COOKIE_SECURE: "false"
      AUTOAUTH_SWAGGER_PUBLIC: "true"
      AUTOAUTH_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080,http://localhost:4321,http://localhost:5500}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 18
