spring.application.name=MotherCare
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:mother_care}
spring.datasource.username=${POSTGRES_USER:test_user}
spring.datasource.password=${POSTGRES_PASSWORD:test_password}

autoauth.issuer=mother-care
autoauth.audience=mother-care-api
autoauth.expiration-minutes=15
autoauth.refresh-expiration-minutes=10080
autoauth.transport=COOKIE_AND_BEARER
autoauth.cookie-name=AUTOAUTH
autoauth.refresh-cookie-name=AUTOAUTH_REFRESH
autoauth.cookie-secure=true
autoauth.cookie-same-site=Lax
autoauth.max-cookie-size=3800
autoauth.swagger-public=true
autoauth.private-key=classpath:private_key.pem
autoauth.public-key=classpath:public_key.pem